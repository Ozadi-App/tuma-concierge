<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#000000" />
  <title>Peebee Gas — Offline</title>
  <style>
    :root { color-scheme: light dark; }
    body { margin: 0; min-height: 100dvh; display: grid; place-content: center; gap: 14px; box-sizing: border-box; padding: 24px; background: #ffffff; color: #0a0a0a; text-align: center; font-family: system-ui, sans-serif; }
    img { width: 80px; height: auto; margin: 0 auto 10px; }
    h1 { margin: 0; font-size: 20px; }
    p { max-width: 300px; margin: 0; color: #5c6670; font-size: 14px; line-height: 1.5; }
    button { min-height: 44px; margin: 8px auto 0; padding: 0 26px; border: 0; border-radius: 999px; background: #c9a227; color: #0a0a0a; font-weight: 800; }
    @media (prefers-color-scheme: dark) { body { background: #0e0e0e; color: #f5f5f5; } p { color: #a0a0a0; } }
  </style>
</head>
<body>
  <picture>
    <source srcset="/brand/peebee-logo-dark.svg?v=logo-6" media="(prefers-color-scheme: dark)" />
    <img src="/brand/peebee-logo-light.svg?v=logo-6" alt="Peebee" />
  </picture>
  <h1>You’re offline</h1>
  <p>Reconnect to verify vouchers and reconcile fuel dispenses.</p>
  <button type="button" onclick="location.reload()">Try again</button>
</body>
</html>
